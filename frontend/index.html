<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QueryMind AI — ask questions in plain English, generate SQL with AI, and get answers straight from your PostgreSQL database."
    />
    <title>QueryMind AI — Natural Language to SQL Intelligence</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('querymind.theme');
          if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[pytest]
testpaths = app/tests
# `live_llm` marks tests that need the real AI provider (Ollama). CI runs the
# fast job with `-m "not live_llm"` and the live job with the marker required.
markers =
    live_llm: requires a real AI provider and model (no mocks, never skipped in the live CI job)
    reads_only: requires a restricted SELECT-only database role (CI provisions it)

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# SQLAlchemy URL is set dynamically from app.core.config.settings.effective_database_url
# (psycopg 3 driver, TLS settings, and all query parameters preserved).
sqlalchemy.url = postgresql+psycopg://placeholder@localhost

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
